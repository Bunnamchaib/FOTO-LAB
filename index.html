<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101316">
  <meta name="description" content="FILM FOTO is a mobile-first retro film simulation editor with local presets and digital date stamps.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="FILM FOTO">
  <link rel="icon" href="logo.png">
  <link rel="apple-touch-icon" href="logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500;700&family=DM+Serif+Display:ital@0;1&family=Italiana&family=Orbitron:wght@400;600;800&family=Permanent+Marker&display=swap" rel="stylesheet">
  <link rel="manifest" href='data:application/manifest+json,{"name":"FILM FOTO","short_name":"FOTO LAB","description":"Retro film simulation editor with local presets and date stamps.","start_url":"./index.html","scope":"./","display":"standalone","background_color":"#101316","theme_color":"#101316","orientation":"portrait","icons":[{"src":"logo.png","sizes":"512x512","type":"image/png","purpose":"any maskable"}]}'>
  <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js" defer></script>
  <title>FILM FOTO</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #101316;
      --panel: #171b20;
      --panel-2: #20262d;
      --line: #303842;
      --text: #f4f1e8;
      --muted: #9ca6b1;
      --accent: #ff8a2a;
      --accent-2: #8bd3ff;
      --danger: #ff5c5c;
      --radius: 8px;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      letter-spacing: 0;
    }

    body {
      min-height: 100svh;
      overflow-x: hidden;
    }

    button, input, select {
      font: inherit;
    }

    button {
      border: 1px solid var(--line);
      background: var(--panel-2);
      color: var(--text);
      min-height: 44px;
      border-radius: var(--radius);
      cursor: pointer;
      touch-action: manipulation;
    }

    button:active {
      transform: translateY(1px);
    }

    button:disabled {
      opacity: .45;
      cursor: not-allowed;
      transform: none;
    }

    .app {
      min-height: 100svh;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 5;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: calc(10px + env(safe-area-inset-top, 0px)) 14px 10px;
      background: color-mix(in srgb, var(--bg) 88%, transparent);
      backdrop-filter: blur(18px);
      border-bottom: 1px solid rgba(255,255,255,.06);
    }

    .brand {
      display: grid;
      gap: 1px;
    }

    .brand strong {
      font-size: 18px;
      line-height: 1;
      font-weight: 850;
      white-space: nowrap;
    }

    .brand span {
      color: var(--muted);
      font-size: 11px;
      text-transform: uppercase;
    }

    .top-actions {
      display: flex;
      gap: 8px;
    }

    .icon-btn {
      min-width: 44px;
      padding: 0 10px;
      font-weight: 800;
    }

    .language-btn {
      min-width: 44px;
      padding: 0 8px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      font-size: 11px;
      font-weight: 850;
    }

    .action-icon {
      min-width: 44px;
      min-height: 38px;
      padding: 0;
      display: inline-grid;
      place-items: center;
    }

    .primary {
      background: var(--accent);
      border-color: #ffb36c;
      color: #1a1008;
      font-weight: 800;
      padding: 0 14px;
    }

    .ghost {
      padding: 0 12px;
    }

    .file-input {
      display: none;
    }

    .stage {
      min-height: 0;
      display: grid;
      place-items: center;
      padding: 12px;
    }

    .preview-wrap {
      position: relative;
      width: 100%;
      height: 100%;
      min-height: 280px;
      max-height: 68svh;
      display: grid;
      place-items: center;
      border: 1px solid rgba(255,255,255,.08);
      border-radius: var(--radius);
      background:
        linear-gradient(45deg, rgba(255,255,255,.035) 25%, transparent 25%),
        linear-gradient(-45deg, rgba(255,255,255,.035) 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, rgba(255,255,255,.035) 75%),
        linear-gradient(-45deg, transparent 75%, rgba(255,255,255,.035) 75%),
        #0b0d0f;
      background-size: 22px 22px;
      background-position: 0 0, 0 11px, 11px -11px, -11px 0;
      overflow: hidden;
    }

    canvas {
      display: block;
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
    }

    .empty-state {
      display: grid;
      gap: 16px;
      justify-items: center;
      padding: 28px;
      text-align: center;
      color: var(--muted);
    }

    .compare-btn {
      position: absolute;
      left: 10px;
      bottom: 10px;
      z-index: 2;
      min-height: 38px;
      padding: 0 12px;
      background: rgba(17, 22, 27, .78);
      backdrop-filter: blur(12px);
    }

    .empty-state b {
      color: var(--text);
      font-size: 20px;
    }

    .controls {
      padding: 10px 12px calc(12px + var(--safe-bottom));
      background: var(--panel);
      border-top: 1px solid rgba(255,255,255,.08);
      display: grid;
      gap: 10px;
    }

    .look-strip {
      display: flex;
      flex-wrap: nowrap;
      gap: 10px;
      overflow-x: auto;
      overflow-y: hidden;
      padding: 1px 1px 4px;
      scroll-behavior: smooth;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      overscroll-behavior-x: contain;
      scroll-snap-type: x proximity;
    }

    .look-strip::-webkit-scrollbar { display: none; }

    .look-categories {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 2px;
      scrollbar-width: none;
    }

    .look-categories::-webkit-scrollbar { display: none; }

    .category-tab {
      flex: 0 0 auto;
      min-height: 34px;
      padding: 0 12px;
      border-radius: 999px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .06em;
    }

    .category-tab.active {
      color: #1a1008;
      background: var(--accent);
      border-color: #ffb36c;
    }

    .look {
      flex: 0 0 auto;
      min-width: 145px;
      display: grid;
      gap: 3px;
      align-content: center;
      text-align: center;
      min-height: 52px;
      padding: 7px 6px;
      border-color: var(--line);
      scroll-snap-align: start;
    }

    .look.active {
      border-color: var(--accent);
      box-shadow: inset 0 0 0 1px rgba(255,138,42,.45);
    }

    .look strong {
      font-size: 13px;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .look span {
      font-size: 10px;
      color: var(--muted);
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .tabs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .edit-actions {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .edit-actions button {
      min-height: 38px;
      font-size: 13px;
    }

    .tool-deck {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 7px;
    }

    .tool-card {
      min-height: 54px;
      padding: 5px 3px;
      display: grid;
      place-items: center;
      align-content: center;
      gap: 2px;
      color: var(--muted);
    }

    .tool-card .lucide { width: 17px; height: 17px; }
    .tool-card span { font-size: 9px; line-height: 1.05; white-space: nowrap; }
    .tool-card.active { color: var(--text); border-color: var(--accent-2); }
    .tool-card:disabled { color: var(--muted); }

    .tab {
      min-height: 38px;
      font-size: 13px;
      color: var(--muted);
    }

    .tab.active {
      color: var(--text);
      border-color: var(--accent-2);
    }

    .panel {
      display: none;
      gap: 10px;
    }

    .panel.active {
      display: grid;
    }

    .sliders {
      display: grid;
      gap: 8px;
    }

    .row {
      display: grid;
      grid-template-columns: 76px 30px minmax(0, 1fr) 30px 38px 30px;
      align-items: center;
      gap: 5px;
      min-height: 34px;
    }

    .row label, .toggle-label {
      color: var(--muted);
      font-size: 12px;
    }

    .row output {
      color: var(--text);
      font-variant-numeric: tabular-nums;
      font-size: 12px;
      text-align: right;
    }

    .reset-slider {
      min-height: 30px;
      padding: 0;
      font-size: 15px;
      line-height: 1;
    }

    .step-slider {
      min-height: 30px;
      padding: 0;
      font-size: 16px;
      line-height: 1;
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--accent);
    }

    .stamp-grid, .preset-grid {
      display: grid;
      gap: 10px;
    }

    .quick-actions, .template-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }

    .switch-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
    }

    .switch {
      inline-size: 58px;
      block-size: 34px;
      padding: 3px;
      border-radius: 999px;
      background: #303842;
      border: 1px solid var(--line);
    }

    .switch::before {
      content: "";
      display: block;
      inline-size: 26px;
      block-size: 26px;
      border-radius: 50%;
      background: #d7dde3;
      transition: transform .18s ease;
    }

    .switch.on {
      background: var(--accent);
    }

    .switch.on::before {
      transform: translateX(24px);
      background: #1a1008;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .field {
      display: grid;
      gap: 6px;
    }

    .field.full {
      grid-column: 1 / -1;
    }

    .field label {
      color: var(--muted);
      font-size: 12px;
    }

    .text-input, select {
      width: 100%;
      min-height: 42px;
      border-radius: var(--radius);
      border: 1px solid var(--line);
      background: #11161b;
      color: var(--text);
      padding: 0 10px;
    }

    .swatches {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 8px;
    }

    .swatch {
      min-height: 38px;
      border-color: rgba(255,255,255,.2);
    }

    .swatch.active {
      outline: 2px solid var(--text);
      outline-offset: 2px;
    }

    input[type="color"].swatch {
      width: 100%;
      padding: 2px;
      background: #11161b;
      cursor: pointer;
    }

    .preset-actions {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }

    .preset-actions button, .field-label-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .field-label-icon {
      justify-content: flex-start;
    }

    .preset-actions button.active {
      color: var(--accent);
      border-color: var(--accent);
      box-shadow: inset 0 0 0 1px rgba(255,138,42,.35);
    }

    .font-sample {
      min-height: 32px;
      display: flex;
      align-items: center;
      padding: 0 10px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #11161b;
      color: var(--muted);
      font-size: 14px;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: calc(22px + var(--safe-bottom));
      z-index: 40;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      max-width: calc(100vw - 32px);
      padding: 10px 13px;
      border: 1px solid rgba(255,138,42,.55);
      border-radius: 999px;
      background: rgba(21,26,31,.94);
      box-shadow: 0 12px 30px rgba(0,0,0,.35);
      color: var(--text);
      font-size: 13px;
      transform: translate(-50%, 12px);
      opacity: 0;
      pointer-events: none;
      transition: opacity .18s ease, transform .18s ease;
    }

    .toast.show { opacity: 1; transform: translate(-50%, 0); }
    .toast.error { border-color: var(--danger); color: #ffd8d8; }

    @media (max-width: 360px) {
      .row { grid-template-columns: 66px 28px minmax(0, 1fr) 28px 34px 28px; gap: 4px; }
    }

    .sheet-backdrop {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: grid;
      align-items: end;
      background: rgba(0, 0, 0, .62);
      backdrop-filter: blur(5px);
    }

    .export-sheet {
      width: 100%;
      max-width: 560px;
      margin: 0 auto;
      display: grid;
      gap: 12px;
      padding: 18px 14px calc(16px + var(--safe-bottom));
      border: 1px solid rgba(255,255,255,.12);
      border-bottom: 0;
      border-radius: 18px 18px 0 0;
      background: #151a1f;
      box-shadow: 0 -18px 50px rgba(0,0,0,.35);
    }

    .sheet-heading { display: grid; gap: 3px; }
    .sheet-heading strong { font-size: 18px; }
    .sheet-heading span { color: var(--muted); font-size: 12px; }
    .export-options { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .export-option { min-height: 58px; padding: 8px 5px; display: grid; gap: 2px; place-items: center; color: var(--muted); }
    .export-option strong { color: var(--text); font-size: 13px; }
    .export-option span { font-size: 10px; }
    .export-option.active { border-color: var(--accent); box-shadow: inset 0 0 0 1px rgba(255,138,42,.42); }
    .sheet-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .sheet-actions .cancel { grid-column: 1 / -1; }

    button, .look-categories, .look-strip, .tabs, .edit-actions, .tool-deck, .template-grid, .swatches, .top-actions {
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      touch-action: manipulation;
    }

    input, textarea, .selectable {
      -webkit-user-select: text;
      user-select: text;
      -webkit-touch-callout: default;
    }

    .history-list {
      display: grid;
      gap: 8px;
    }

    .history-item {
      display: grid;
      grid-template-columns: 44px minmax(0, 1fr);
      align-items: center;
      gap: 10px;
      text-align: left;
      padding: 6px;
    }

    .history-thumb {
      width: 44px;
      height: 44px;
      object-fit: cover;
      border-radius: 6px;
      background: #0b0d0f;
    }

    .history-item span {
      display: block;
      color: var(--muted);
      font-size: 11px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .danger {
      color: #ffe2e2;
      border-color: rgba(255,92,92,.45);
      background: rgba(255,92,92,.12);
    }

    .footer-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .hidden {
      display: none;
    }

    .install-tip {
      color: var(--muted);
      font-size: 11px;
      line-height: 1.35;
      text-align: center;
    }

    @media (min-width: 860px) {
      .app {
        grid-template-columns: minmax(0, 1fr) 390px;
        grid-template-rows: auto minmax(0, 1fr);
      }

      .topbar {
        grid-column: 1 / -1;
      }

      .stage {
        padding: 18px;
      }

      .preview-wrap {
        max-height: calc(100svh - 96px);
      }

      .controls {
        border-top: 0;
        border-left: 1px solid rgba(255,255,255,.08);
        align-content: start;
        overflow-y: auto;
      }
    }

    @media (max-width: 460px) {
      .topbar {
        padding-left: 10px;
        padding-right: 10px;
      }

      .brand strong {
        font-size: 13px;
      }

      .brand span {
        display: none;
      }

      .top-actions {
        gap: 6px;
      }

      .primary, .ghost {
        padding-left: 10px;
        padding-right: 10px;
      }

    }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="brand">
        <strong>FILM FOTO</strong>
        <span>Mobile film lab</span>
      </div>
      <div class="top-actions">
        <input class="file-input" id="fileInput" type="file" accept="image/*" tabindex="-1" aria-hidden="true">
        <button class="primary" id="importBtn" type="button"><i data-lucide="image-plus"></i><span data-i18n="import">Import</span></button>
        <button class="ghost" id="exportBtn" type="button"><i data-lucide="download"></i><span data-i18n="export">Export</span></button>
        <button class="ghost language-btn" id="languageBtn" type="button" aria-label="Switch language" title="Switch language"><i data-lucide="languages"></i><span id="languageLabel">TH</span></button>
      </div>
    </header>

    <section class="stage" aria-label="Image Preview">
      <div class="preview-wrap">
        <div class="empty-state" id="emptyState">
          <b>Image Preview</b>
          <span>No photo loaded</span>
          <button class="primary" id="emptyImportBtn" type="button">Import Photo</button>
        </div>
        <canvas class="hidden" id="previewCanvas"></canvas>
        <button class="compare-btn hidden" id="beforeAfterBtn" type="button">Before / After Hold</button>
      </div>
    </section>

    <aside class="controls">
      <div class="install-tip" id="installTip" data-i18n="installTip">Add to Home Screen supported. On iPhone: Share &gt; Add to Home Screen.</div>
      <section class="look-categories" id="lookCategories" aria-label="Film preset categories"></section>
      <section class="look-strip" id="lookStrip" aria-label="Film filters"></section>

      <section class="tool-deck" aria-label="Editor tools">
        <button class="tool-card" id="undoBtn" type="button" aria-label="Undo" title="Undo"><i data-lucide="undo-2"></i><span data-i18n="undo">Undo</span></button>
        <button class="tool-card" id="redoBtn" type="button" aria-label="Redo" title="Redo"><i data-lucide="redo-2"></i><span data-i18n="redo">Redo</span></button>
        <button class="tool-card" id="randomLookBtn" type="button" aria-label="Random look" title="Random look"><i data-lucide="shuffle"></i><span data-i18n="random">Random</span></button>
        <button class="tool-card" id="resetLookBtn" type="button" aria-label="Reset adjustments" title="Reset adjustments"><i data-lucide="rotate-ccw"></i><span data-i18n="reset">Reset</span></button>
        <button class="tool-card" id="resetAllBtn" type="button" aria-label="Reset all" title="Reset all"><i data-lucide="rotate-ccw"></i><span data-i18n="resetAll">Reset All</span></button>
        <button class="tool-card active tab" data-tab="adjust" type="button"><i data-lucide="sliders-horizontal"></i><span data-i18n="adjust">Adjust</span></button>
        <button class="tool-card tab" data-tab="stamp" type="button"><i data-lucide="calendar-days"></i><span data-i18n="date">Date</span></button>
        <button class="tool-card tab" data-tab="preset" type="button"><i data-lucide="bookmark"></i><span data-i18n="preset">Preset</span></button>
      </section>

      <section class="panel active" id="adjustPanel">
        <div class="sliders" id="sliderList"></div>
      </section>

      <section class="panel" id="stampPanel" data-feature="dateStamp">
        <div class="stamp-grid">
          <div class="switch-row">
            <span class="toggle-label" data-i18n="dateStamp">Digital Date Stamp</span>
            <button class="switch on" id="stampToggle" type="button" aria-label="Toggle date stamp"></button>
          </div>
          <div class="form-grid">
            <div class="field">
              <label for="stampPosition" data-i18n="position">Position</label>
              <select id="stampPosition">
                <option value="bottom-right">Bottom Right</option>
                <option value="bottom-left">Bottom Left</option>
                <option value="top-right">Top Right</option>
                <option value="top-left">Top Left</option>
                <option value="center-bottom">Center Bottom</option>
              </select>
            </div>
            <div class="field">
              <label for="stampYear" data-i18n="year">Year</label>
              <select id="stampYear">
                <option value="current">Current</option>
                <option value="random90s">Random 90s</option>
                <option value="1998">1998</option>
                <option value="1999">1999</option>
                <option value="2001">2001</option>
              </select>
            </div>
            <div class="field full">
              <label for="stampDateFormat" data-i18n="dateFormat">Date Format</label>
              <select id="stampDateFormat">
                <option value="yy-mm-dd">YY MM DD</option>
                <option value="dd-mm-yy">DD MM YY</option>
                <option value="dd-mm-yyyy">DD MM YYYY</option>
                <option value="yyyy">YYYY (1998)</option>
                <option value="thai-year">Thai Year (2541)</option>
              </select>
            </div>
            <div class="field full">
              <label for="stampFont" data-i18n="font">Font</label>
              <select id="stampFont">
                <option value="classic">Classic Digital</option>
                <option value="marker">Marker / Handwritten</option>
                <option value="cake">Cake Italic</option>
                <option value="courier">Courier New</option>
                <option value="petal">Petal</option>
              </select>
              <div class="font-sample" id="stampFontSample" aria-label="Date font preview">'26 09 14</div>
            </div>
            <div class="field full">
              <label for="stampText" data-i18n="customText">Custom Text</label>
              <input class="text-input" id="stampText" type="text" maxlength="28" placeholder="FILM FOTO">
            </div>

        console.warn("Local storage read blocked", error);
      }
      return fallbackStorage.get(key) || null;
    }

    function writeStorage(key, value) {

        if (window.localStorage) {
          window.localStorage.setItem(key, value);
          return;

      } catch (error) {
        console.warn("Local storage write blocked", error);
      }
      fallbackStorage.set(key, value);
    }

    function sameSettings(a, b) {
      return JSON.stringify(a) === JSON.stringify(b);

    function updateEditButtons() {
      undoBtn.disabled = undoStack.length === 0;
      redoBtn.disabled = redoStack.length === 0;
    }

    function pushUndoState() {
      const snapshot = snapshotSettings();
      const last = undoStack[undoStack.length - 1];
      if (!last || !sameSettings(last, snapshot)) {
        undoStack.push(snapshot);
        if (undoStack.length > 40) undoStack.shift();
      }
      redoStack.length = 0;
      updateEditButtons();
    }

    function commitStateChange(change) {
      pushUndoState();
      change();
      renderLooks();
      renderControls();
      renderSwatches();
      syncFormFromState();
      renderImage();
      saveLastSession();
      updateEditButtons();
    }

    function currentLookValues() {
      const base = looks[state.activeLook];
      const strength = state.controls.strength / 100;
      const values = {};
      for (const [key] of controlDefs) {
        if (key === "strength") continue;
        values[key] = (base[key] || 0) * strength + state.controls[key];
      }
      return values;
    }

      lookCategories.innerHTML = "";

        button.type = "button";
        button.className = `category-tab${state.activeCategory === id ? " active" : ""}`;
        button.textContent = t(id) || label;
        button.addEventListener("click", () => {
          state.activeCategory = id;
          writeStorage(LOOK_CATEGORY_KEY, id);
          renderPresetCategories();
          renderLooks(true);
        });
        lookCategories.appendChild(button);
      }
    }

      if (state.stampFont === "marker") return '"Permanent Marker", "Comic Sans MS", cursive';
      if (state.stampFont === "cake") return '"DM Serif Display", Georgia, serif';
      if (state.stampFont === "courier" || state.stampFont === "pixel") return '"Courier New", "DM Mono", ui-monospace, monospace';
      if (state.stampFont === "petal") return '"Italiana", "Times New Roman", serif';
      return '"Orbitron", "DM Mono", ui-monospace, monospace';
    }

    function syncStampFontSample() {
      stampFontSample.style.fontFamily = stampFontFamily();
      stampFontSample.style.fontStyle = state.stampFont === "cake" ? "italic" : "normal";
      stampFontSample.style.fontWeight = state.stampFont === "petal" ? "400" : "700";
    }

    function stampCanvasFont(size) {
      const style = state.stampFont === "cake" ? "italic " : "";
      const weight = state.stampFont === "petal" ? "400" : state.stampFont === "marker" ? "400" : "900";
      return `${style}${weight} ${size}px ${stampFontFamily()}`;
    }

    async function ensureStampFont() {
      if (!document.fonts?.load) return;
      const descriptor = stampCanvasFont(40);
      await document.fonts.load(descriptor, "26 09 14").catch(() => null);
      await document.fonts.ready.catch(() => null);
    }

      for (const [key, look] of Object.entries(looks).filter(([, look]) => state.activeCategory === "all" || look.category === state.activeCategory)) {
        const button = document.createElement("button");
        button.type = "button";
        button.className = `look${key === state.activeLook ? " active" : ""}`;
        button.innerHTML = `<strong>${look.name}</strong><span>${look.note}</span>`;
        button.addEventListener("click", () => {
          commitStateChange(() => {
            state.activeLook = key;
          });
        });
        lookStrip.appendChild(button);
        if (revealActive && key === state.activeLook) {
          requestAnimationFrame(() => button.scrollIntoView({ behavior: "smooth", block: "nearest", inline: "center" }));
        }
      }
    }

    function resetControlValue(key) {
      const def = controlDefs.find(([controlKey]) => controlKey === key);
      return def ? def[4] : 0;
    }

    function resetStampValue(key) {
      const def = stampControlDefs.find(([controlKey]) => controlKey === key);
      return def ? def[4] : 0;
    }

    function makeRange(parent, key, label, min, max, getValue, setValue, resetValue) {
      const row = document.createElement("div");
      row.className = "row";
      const id = `range-${key}`;
      row.innerHTML = `
        <label for="${id}">${t(label)}</label>
        <button class="step-slider" type="button" aria-label="Decrease ${label}" title="Decrease ${label}">−</button>
        <input id="${id}" type="range" min="${min}" max="${max}" value="${getValue()}">
        <button class="step-slider" type="button" aria-label="Increase ${label}" title="Increase ${label}">+</button>
        <output>${getValue()}</output>
        <button class="reset-slider" type="button" aria-label="Reset ${label}" title="Reset ${label}">↺</button>
      `;
      const input = row.querySelector("input");
      const output = row.querySelector("output");
      const [decreaseBtn, increaseBtn] = row.querySelectorAll(".step-slider");
      const resetSlider = row.querySelector(".reset-slider");
      let repeatDelay = null;
      let repeatTimer = null;
      const stopRepeat = () => {
        clearTimeout(repeatDelay);
        clearInterval(repeatTimer);
        repeatDelay = repeatTimer = null;
      };
      const updateValue = value => {
        const next = clamp(value, min, max);
        if (next === getValue()) return;
        commitStateChange(() => setValue(next));
      };
      const bindStepper = (button, direction) => {
        const step = Number(input.step) || 1;
        const move = () => updateValue(getValue() + step * direction);
        button.addEventListener("pointerdown", event => {
          event.preventDefault();
          stopRepeat();
          move();
          window.addEventListener("pointerup", stopRepeat, { once: true });
          window.addEventListener("pointercancel", stopRepeat, { once: true });
          repeatDelay = setTimeout(() => {
            repeatTimer = setInterval(move, 80);
          }, 400);
        });
        ["pointerup", "pointercancel", "pointerleave", "lostpointercapture"].forEach(eventName => button.addEventListener(eventName, stopRepeat));
      };
      input.addEventListener("input", () => {
        updateValue(Number(input.value));
        output.textContent = input.value;
      });
      bindStepper(decreaseBtn, -1);
      bindStepper(increaseBtn, 1);
      resetSlider.addEventListener("click", () => {
        commitStateChange(() => {
          setValue(resetValue);
        });
      });
      parent.appendChild(row);
    }

    function renderControls() {
      sliderList.innerHTML = "";
      for (const [key, label, min, max] of controlDefs) {
        makeRange(sliderList, key, label, min, max, () => state.controls[key], value => state.controls[key] = value, resetControlValue(key));
      }

      stampSliders.innerHTML = "";
      for (const [key, label, min, max] of stampControlDefs) {
        makeRange(stampSliders, key, label, min, max, () => state.stamp[key], value => state.stamp[key] = value, resetStampValue(key));
      }
    }

    function renderSwatches() {
      stampSwatches.innerHTML = "";
      for (const color of recommendedStampColors) {
        const button = document.createElement("button");
        button.type = "button";
        button.className = `swatch${color.toLowerCase() === state.stampColor.toLowerCase() ? " active" : ""}`;
        button.style.background = color;
        button.title = color;
        button.addEventListener("click", () => {
          commitStateChange(() => {
            state.stampColor = color;
          });
        });
        stampSwatches.appendChild(button);
      }
      const custom = document.createElement("input");
      custom.type = "color";
      custom.className = `swatch${recommendedStampColors.includes(state.stampColor.toLowerCase()) ? "" : " active"}`;
      custom.value = state.stampColor;
      custom.title = "Custom color";
      custom.setAttribute("aria-label", "Custom stamp color");
      custom.addEventListener("input", () => {
        commitStateChange(() => {
          state.stampColor = custom.value;
        });
      });
      stampSwatches.appendChild(custom);
    }

    function renderTabs() {
      document.querySelectorAll(".tab").forEach(tab => {
        tab.addEventListener("click", () => {
          document.querySelectorAll(".tab").forEach(item => item.classList.remove("active"));
          document.querySelectorAll(".panel").forEach(item => item.classList.remove("active"));
          tab.classList.add("active");
          document.getElementById(`${tab.dataset.tab}Panel`).classList.add("active");
        });
      });
    }

    function applyFilm(imageData) {
      const data = imageData.data;
      const width = imageData.width;
      const height = imageData.height;
      const look = currentLookValues();
      const contrastFactor = (259 * (look.contrast + 255)) / (255 * (259 - look.contrast));
      const satFactor = 1 + look.saturation / 100;
      const fade = look.fade / 100;
      const shadowBoost = look.shadowDepth / 100;
      const highlightRoll = look.highlightRoll / 100;
      const warmth = look.warmth;
      const grain = look.grain;
      const vignette = look.vignette / 100;
      const cx = width / 2;
      const cy = height / 2;
      const maxDist = Math.sqrt(cx * cx + cy * cy);

      for (let i = 0; i < data.length; i += 4) {
        const pixel = i / 4;
        const x = pixel % width;
        const y = Math.floor(pixel / width);
        const originalR = data[i];
        const originalG = data[i + 1];
        const originalB = data[i + 2];
        let r = originalR + look.brightness + warmth * 0.55;
        let g = originalG + look.brightness + warmth * 0.14;
        let b = originalB + look.brightness - warmth * 0.42;

        r = contrastFactor * (r - 128) + 128;
        g = contrastFactor * (g - 128) + 128;
        b = contrastFactor * (b - 128) + 128;

        const lum = 0.2126 * r + 0.7152 * g + 0.0722 * b;
        r = lum + (r - lum) * satFactor;
        g = lum + (g - lum) * satFactor;
        b = lum + (b - lum) * satFactor;

        const shadow = Math.max(0, 1 - lum / 140) * shadowBoost * 48;
        r -= shadow;
        g -= shadow;
        b -= shadow;

        const high = Math.max(0, (lum - 170) / 85) * highlightRoll;
        r = lerp(r, 236, high * 0.18);
        g = lerp(g, 232, high * 0.18);
        b = lerp(b, 218, high * 0.18);

        r = lerp(r, 32 + r * 0.88, fade);
        g = lerp(g, 36 + g * 0.88, fade);
        b = lerp(b, 39 + b * 0.88, fade);

        r += look.redShift || 0;
        g += look.greenShift || 0;
        b += look.blueShift || 0;

        if (looks[state.activeLook].category === "bw") {
          const mono = 0.32 * r + 0.48 * g + 0.2 * b;
          r = g = b = mono;
        }

        if (grain > 0) {
          const noise = (Math.random() - 0.5) * grain * 1.7;
          r += noise;
          g += noise;
          b += noise;
        }

        if (vignette > 0) {
          const dx = x - cx;
          const dy = y - cy;
          const distance = Math.sqrt(dx * dx + dy * dy) / maxDist;
          const shade = 1 - Math.pow(distance, 1.9) * vignette * 0.85;
          r *= shade;
          g *= shade;
          b *= shade;
        }

        data[i] = clamp(r);
        data[i + 1] = clamp(g);
        data[i + 2] = clamp(b);
      }
      return imageData;
    }

    function stampDateText() {
      if (state.stampStyle === "text") return state.stampText.trim().toUpperCase() || "FILM FOTO";
      const now = new Date();
      let year = now.getFullYear();
      if (state.stampYear === "random90s") year = Number(state.randomRetroYear);
      if (/^\d{4}$/.test(state.stampYear)) year = Number(state.stampYear);
      const yy = String(year).slice(-2);
      const mm = String(now.getMonth() + 1).padStart(2, "0");
      const dd = String(now.getDate()).padStart(2, "0");
      const date = {
        "yy-mm-dd": `'${yy} ${mm} ${dd}`,
        "dd-mm-yy": `'${dd} ${mm} ${yy}`,
        "dd-mm-yyyy": `${dd} ${mm} ${year}`,
        yyyy: String(year),
        "thai-year": String(year + 543),
      }[state.stampDateFormat] || `'${yy} ${mm} ${dd}`;
      return `${date}${state.stampText.trim() ? " " + state.stampText.trim().toUpperCase() : ""}`;
    }

    function drawDateStamp(targetCtx, width, height) {
      if (!state.stampEnabled) return;
      const text = stampDateText();
      const size = Math.round(Math.max(16, Math.min(width / 11, state.stamp.stampSize * (width / previewCanvas.width || 1))));
      const margin = Math.round(state.stamp.stampMargin * (width / previewCanvas.width || 1));
      targetCtx.save();
      targetCtx.globalAlpha = state.stamp.stampOpacity / 100;
      targetCtx.font = stampCanvasFont(size);
      targetCtx.textBaseline = "alphabetic";
      targetCtx.lineWidth = state.stamp.stampWeight;
      targetCtx.strokeStyle = state.stampColor;
      targetCtx.fillStyle = state.stampColor;
      targetCtx.shadowColor = state.stampColor;
      targetCtx.shadowBlur = state.stamp.stampGlow;

      const metrics = targetCtx.measureText(text);
      let x = margin;
      let y = height - margin;
      if (state.stampPosition.includes("right")) x = width - margin - metrics.width;
      if (state.stampPosition.includes("top")) y = margin + size;
      if (state.stampPosition === "center-bottom") x = (width - metrics.width) / 2;

      for (let i = 0; i < state.stamp.stampWeight; i++) {
        targetCtx.strokeText(text, x, y);
      }
      targetCtx.fillText(text, x, y);
      targetCtx.restore();
    }

    function renderImage() {
      if (!state.imageLoaded) return;
      previewCanvas.width = sourceCanvas.width;
      previewCanvas.height = sourceCanvas.height;
      ctx.drawImage(sourceCanvas, 0, 0);
      const imageData = ctx.getImageData(0, 0, previewCanvas.width, previewCanvas.height);
      ctx.putImageData(applyFilm(imageData), 0, 0);
      drawDateStamp(ctx, previewCanvas.width, previewCanvas.height);
    }

    function renderBeforeImage() {
      if (!state.imageLoaded) return;
      previewCanvas.width = sourceCanvas.width;
      previewCanvas.height = sourceCanvas.height;
      ctx.drawImage(sourceCanvas, 0, 0);
    }

    function processedFileName() {
      const now = new Date();
      const stamp = [
        now.getFullYear(),
        String(now.getMonth() + 1).padStart(2, "0"),
        String(now.getDate()).padStart(2, "0"),
        String(now.getHours()).padStart(2, "0"),
        String(now.getMinutes()).padStart(2, "0"),
      ].join("");
      return `FILM-FOTO-${looks[state.activeLook].name.replace(/\s+/g, "-").toLowerCase()}-${stamp}.jpg`;
    }

    function getExportSettings() {
      return exportQualities[state.exportQuality] || exportQualities.maximum;
    }

    async function renderFinalImage() {
      await ensureStampFont();
      const options = getExportSettings();
      const finalCanvas = document.createElement("canvas");
      finalCanvas.width = Math.max(1, Math.round(sourceCanvas.width * options.scale));
      finalCanvas.height = Math.max(1, Math.round(sourceCanvas.height * options.scale));
      const finalCtx = finalCanvas.getContext("2d", { willReadFrequently: true });
      finalCtx.drawImage(sourceCanvas, 0, 0, finalCanvas.width, finalCanvas.height);
      const imageData = finalCtx.getImageData(0, 0, finalCanvas.width, finalCanvas.height);
      finalCtx.putImageData(applyFilm(imageData), 0, 0);
      drawDateStamp(finalCtx, finalCanvas.width, finalCanvas.height);
      return finalCanvas;
    }

    async function createExportBlob() {
      const options = getExportSettings();
      const finalCanvas = await renderFinalImage();
      return new Promise((resolve, reject) => {
        finalCanvas.toBlob(blob => blob ? resolve(blob) : reject(new Error("Could not create image file")), "image/jpeg", options.quality);
      });
    }

    function showLoadedImage(img) {
      sourceCanvas.width = img.naturalWidth;
      sourceCanvas.height = img.naturalHeight;
      sourceCtx.clearRect(0, 0, sourceCanvas.width, sourceCanvas.height);
      sourceCtx.drawImage(img, 0, 0);
      state.imageLoaded = true;
      previewCanvas.classList.remove("hidden");
      beforeAfterBtn.classList.remove("hidden");
      emptyState.classList.add("hidden");
      renderImage();
    }

    function loadImageFromDataUrl(dataUrl) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => {
          showLoadedImage(img);
          resolve();
        };
        img.onerror = reject;
        img.src = dataUrl;
      });
    }

    function loadImage(file) {
      if (!file) return;
      const reader = new FileReader();
      reader.onload = event => {
        loadImageFromDataUrl(event.target.result).then(() => {
          saveLastImage(file);
          saveHistoryImage(file);
          saveLastSession();
        });
      };
      reader.readAsDataURL(file);
    }

    function snapshotSettings() {
      return {
        activeLook: state.activeLook,
        stampEnabled: state.stampEnabled,
        stampPosition: state.stampPosition,
        stampYear: state.stampYear,
        stampDateFormat: state.stampDateFormat,
        stampFont: state.stampFont,
        stampText: state.stampText,
        stampColor: state.stampColor,
        stampStyle: state.stampStyle,
        exportQuality: state.exportQuality,
        activeCategory: state.activeCategory,
        controls: { ...state.controls },
        stamp: { ...state.stamp },
      };
    }

    function openMemoryDB() {
      return new Promise((resolve, reject) => {
        if (!window.indexedDB) {
          reject(new Error("IndexedDB is not available"));
          return;
        }
        const request = window.indexedDB.open(FILM_FOTO_DB, 1);
        request.onupgradeneeded = () => {
          request.result.createObjectStore(MEMORY_STORE);
        };
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);
      });
    }

    async function setMemoryRecord(key, value) {
      const db = await openMemoryDB();
      return new Promise((resolve, reject) => {
        const transaction = db.transaction(MEMORY_STORE, "readwrite");
        transaction.objectStore(MEMORY_STORE).put(value, key);
        transaction.oncomplete = () => {
          db.close();
          resolve();
        };
        transaction.onerror = () => {
          db.close();
          reject(transaction.error);
        };
      });
    }

    async function getMemoryRecord(key) {
      const db = await openMemoryDB();
      return new Promise((resolve, reject) => {
        const transaction = db.transaction(MEMORY_STORE, "readonly");
        const request = transaction.objectStore(MEMORY_STORE).get(key);
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);
        transaction.oncomplete = () => db.close();
      });
    }

    function saveLastSession() {
      try {
        const payload = {
          type: LAST_SETTINGS_RECORD,
          updatedAt: new Date().toISOString(),
          settings: snapshotSettings(),
        };
        writeStorage(LAST_SETTINGS_KEY, JSON.stringify(payload));
        setMemoryRecord(LAST_SETTINGS_RECORD, payload).catch(error => {
          console.warn("Could not mirror last settings", error);
        });
      } catch (error) {
        console.warn("Could not save last settings", error);
      }
    }

    async function saveLastImage(file) {
      try {
        await setMemoryRecord(LAST_IMAGE_KEY, {
          name: file.name,
          type: file.type,
          updatedAt: new Date().toISOString(),
          blob: file,
        });
      } catch (error) {
        console.warn("Could not save last image", error);
      }
    }

    async function saveHistoryImage(file) {
      try {
        const existing = await getMemoryRecord(HISTORY_KEY).catch(() => []) || [];
        const item = {
          id: crypto.randomUUID ? crypto.randomUUID() : String(Date.now()),
          name: file.name || "Imported photo",
          type: file.type,
          updatedAt: new Date().toISOString(),
          blob: file,
        };
        await setMemoryRecord(HISTORY_KEY, [item, ...existing].slice(0, 5));
        renderHistoryList();
      } catch (error) {
        console.warn("Could not save history image", error);
      }
    }

    async function renderHistoryList() {
      historyList.innerHTML = "";
      let items = [];
      try {
        items = await getMemoryRecord(HISTORY_KEY) || [];
      } catch {
        items = [];
      }
      if (!items.length) {
        const empty = document.createElement("span");
        empty.textContent = "No recent photos";
        historyList.appendChild(empty);
        return;
      }
      for (const item of items.slice(0, 5)) {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "history-item";
        const url = URL.createObjectURL(item.blob);
        button.innerHTML = `<img class="history-thumb" src="${url}" alt=""><span>${item.name}</span>`;
        button.addEventListener("click", () => {
          loadImageFromDataUrl(url).then(saveLastSession);
        });
        historyList.appendChild(button);
      }
    }

    async function restoreLastSession() {
      try {
        const raw = readStorage(LAST_SETTINGS_KEY);
        const lastSettings = raw ? JSON.parse(raw) : await getMemoryRecord(LAST_SETTINGS_RECORD);
        if (lastSettings?.settings) {
          applySettings(lastSettings.settings, { persist: false });
        }

        const lastImage = await getMemoryRecord(LAST_IMAGE_KEY);
        if (lastImage?.blob) {
          const reader = new FileReader();
          reader.onload = event => loadImageFromDataUrl(event.target.result);
          reader.readAsDataURL(lastImage.blob);
        }
        renderHistoryList();
      } catch (error) {
        console.warn("Could not restore last session", error);
      }
    }

    function applySettings(settings, options = {}) {
      Object.assign(state, {
        activeLook: settings.activeLook || "positive",
        stampEnabled: settings.stampEnabled ?? true,
        stampPosition: settings.stampPosition || "bottom-right",
        stampYear: settings.stampYear || "current",
        stampDateFormat: ["yy-mm-dd", "dd-mm-yy", "dd-mm-yyyy", "yyyy", "thai-year"].includes(settings.stampDateFormat) ? settings.stampDateFormat : "yy-mm-dd",
        stampFont: ["classic", "marker", "cake", "courier", "petal"].includes(settings.stampFont) ? settings.stampFont : settings.stampFont === "pixel" ? "courier" : "classic",
        stampText: settings.stampText || "",
        stampColor: settings.stampColor || "#ff6600",
        stampStyle: ["date", "film", "y2k", "place", "text"].includes(settings.stampStyle) ? settings.stampStyle : "date",
        exportQuality: settings.exportQuality || (Number(settings.jpegQuality) <= .84 ? "low" : Number(settings.jpegQuality) <= .94 ? "medium" : "maximum"),
        activeCategory: settings.activeCategory || readStorage(LOOK_CATEGORY_KEY) || "all",
      });
      Object.assign(state.controls, settings.controls || {});
      Object.assign(state.stamp, settings.stamp || {});
      syncFormFromState();
      renderLooks();
      renderPresetCategories();
      renderControls();
      renderSwatches();
      renderImage();
      if (options.persist !== false) saveLastSession();
    }

    function getPresets() {
      try {
        return JSON.parse(readStorage(STORE_KEY)) || [];
      } catch {
        return [];
      }
    }

    function setPresets(presets) {
      writeStorage(STORE_KEY, JSON.stringify(presets));
      renderPresetOptions();
    }

    function renderPresetOptions() {
      const presets = getPresets();
      presetSelect.innerHTML = "";
      if (!presets.length) {
        const option = document.createElement("option");
        option.value = "";
        option.textContent = "No saved presets";
        presetSelect.appendChild(option);
        return;
      }
      for (const preset of [...presets].sort((a, b) => Number(b.favorite) - Number(a.favorite))) {
        const option = document.createElement("option");
        option.value = preset.id;
        option.textContent = `${preset.favorite ? "★ " : ""}${preset.name}`;
        presetSelect.appendChild(option);
      }
      const activePreset = selectedPreset();
      favoritePresetBtn.classList.toggle("active", Boolean(activePreset?.favorite));
    }

    function selectedPreset() {
      return getPresets().find(preset => preset.id === presetSelect.value);
    }

    function syncFormFromState() {
      stampToggle.classList.toggle("on", state.stampEnabled);
      stampPosition.value = state.stampPosition;
      stampYear.value = state.stampYear;
      stampDateFormat.value = state.stampDateFormat;
      stampFont.value = state.stampFont;
      syncStampFontSample();
      stampText.value = state.stampText;
      stampStyle.value = state.stampStyle;
      refreshIcons();
    }

    importBtn.addEventListener("click", () => fileInput.click());
    languageBtn.addEventListener("click", () => {
      language = language === "en" ? "th" : "en";
      writeStorage(LANGUAGE_KEY, language);
      applyLanguage();
    });
    emptyImportBtn.addEventListener("click", () => fileInput.click());
    fileInput.addEventListener("change", event => loadImage(event.target.files[0]));

    function openExportSheet() {
      if (!state.imageLoaded) {
        fileInput.click();
        return;
      }
      renderExportOptions();
      exportStatus.textContent = "Choose final quality. Your preview is unchanged.";
      exportSheet.classList.remove("hidden");
      refreshIcons();
    }

    function closeExportSheet() {
      exportSheet.classList.add("hidden");
    }

    function reportExportError(error) {
      console.warn("Export failed", error);
      exportStatus.textContent = "Could not create the photo file. Please try again.";
    }

    function renderExportOptions() {
      exportOptions.innerHTML = "";
      for (const [id, option] of Object.entries(exportQualities)) {
        const button = document.createElement("button");
        button.type = "button";
        button.className = `export-option${state.exportQuality === id ? " active" : ""}`;
        button.innerHTML = `<strong>${option.label}</strong><span>${option.note}</span>`;
        button.addEventListener("click", () => {
          state.exportQuality = id;
          writeStorage(EXPORT_QUALITY_KEY, id);
          saveLastSession();
          renderExportOptions();
        });
        exportOptions.appendChild(button);
      }
    }

    async function downloadImage() {
      if (!state.imageLoaded) return openExportSheet();
      const blob = await createExportBlob();
      const link = document.createElement("a");
      link.download = processedFileName();
      link.href = URL.createObjectURL(blob);
      link.click();
      setTimeout(() => URL.revokeObjectURL(link.href), 1200);
    }

    async function shareImage() {
      if (!state.imageLoaded) return openExportSheet();
      const blob = await createExportBlob();
      const file = new File([blob], processedFileName(), { type: "image/jpeg" });
      if (navigator.share && navigator.canShare?.({ files: [file] })) {
        try {
          await navigator.share({ title: "FOTO LAB", files: [file] });
        } catch (error) {
          if (error?.name !== "AbortError") console.warn("Could not share image", error);
        }
        return;
      }
      await downloadImage();
    }

    exportBtn.addEventListener("click", openExportSheet);
    closeExportBtn.addEventListener("click", closeExportSheet);
    sheetDownloadBtn.addEventListener("click", async () => {
      try {
        await downloadImage();
        closeExportSheet();
      } catch (error) {
        reportExportError(error);
      }
    });
    sheetShareBtn.addEventListener("click", async () => {
      try {
        await shareImage();
        closeExportSheet();
      } catch (error) {
        reportExportError(error);
      }
    });
    exportSheet.addEventListener("click", event => {
      if (event.target === exportSheet) closeExportSheet();
    });

    beforeAfterBtn.addEventListener("pointerdown", event => {
      event.preventDefault();
      beforeAfterBtn.textContent = "Before";
      renderBeforeImage();
    });

    ["pointerup", "pointerleave", "pointercancel"].forEach(eventName => {
      beforeAfterBtn.addEventListener(eventName, () => {
        beforeAfterBtn.textContent = "Before / After Hold";
        renderImage();
      });
    });

    undoBtn.addEventListener("click", () => {
      const previous = undoStack.pop();
      if (!previous) return;
      redoStack.push(snapshotSettings());
      applySettings(previous);
      updateEditButtons();
    });

    redoBtn.addEventListener("click", () => {
      const next = redoStack.pop();
      if (!next) return;
      undoStack.push(snapshotSettings());
      applySettings(next);
      updateEditButtons();
    });

    resetAllBtn.addEventListener("click", () => {
      commitStateChange(() => {
        Object.assign(state, defaultSettings());
      });
    });

    randomLookBtn.addEventListener("click", () => {
      commitStateChange(() => {
        const keys = Object.keys(looks);
        state.activeLook = keys[Math.floor(Math.random() * keys.length)];
        for (const [key, , min, max] of controlDefs) {
          if (key === "strength") {
            state.controls[key] = 70 + Math.floor(Math.random() * 91);
          } else {
            state.controls[key] = Math.round((min + Math.random() * (max - min)) * 0.42);
          }
        }
      });
    });

    resetLookBtn.addEventListener("click", () => {
      commitStateChange(() => {
        state.controls = Object.fromEntries(controlDefs.map(([key, , , , value]) => [key, value]));
      });
    });

    resetStampBtn.addEventListener("click", () => {
      commitStateChange(() => {
        state.stampEnabled = true;
        state.stampPosition = "bottom-right";
        state.stampYear = "current";
        state.stampDateFormat = "yy-mm-dd";
        state.stampFont = "classic";
        state.stampText = "";
        state.stampColor = "#ff6600";
        state.stampStyle = "date";
        state.stamp = Object.fromEntries(stampControlDefs.map(([key, , , , value]) => [key, value]));
      });
    });

    stampToggle.addEventListener("click", () => {
      commitStateChange(() => {
        state.stampEnabled = !state.stampEnabled;
      });
    });

    stampPosition.addEventListener("change", () => {
      commitStateChange(() => {
        state.stampPosition = stampPosition.value;
      });
    });

    stampYear.addEventListener("change", () => {
      commitStateChange(() => {
        state.stampYear = stampYear.value;
        if (state.stampYear === "random90s") {
          state.randomRetroYear = String(1990 + Math.floor(Math.random() * 10));
        }
      });
    });

    stampDateFormat.addEventListener("change", () => {
      commitStateChange(() => {
        state.stampDateFormat = stampDateFormat.value;
      });
    });

    stampFont.addEventListener("change", () => {
      commitStateChange(() => {
        state.stampFont = stampFont.value;
      });
      ensureStampFont().then(() => {
        syncStampFontSample();
        renderImage();
      });
    });

    stampText.addEventListener("input", () => {
      commitStateChange(() => {
        state.stampText = stampText.value;
      });
    });

    stampStyle.addEventListener("change", () => {
      commitStateChange(() => {
        const style = stampStyle.value;
        state.stampStyle = style;
        state.stampEnabled = true;
        state.stampPosition = "bottom-right";
        state.stampYear = style === "y2k" ? "1999" : "current";
        state.stampFont = style === "y2k" ? "courier" : "classic";
        state.stampColor = style === "y2k" ? "#66e6ff" : "#ff6600";
        state.stamp.stampOpacity = style === "date" ? 30 : 94;
        state.stamp.stampGlow = style === "y2k" ? 22 : 4;
        state.stampText = { date: "", film: "FILM FOTO", y2k: "Y2K CAM", place: "BKK", text: state.stampText || "FILM FOTO" }[style] || "";
      });
      ensureStampFont().then(renderImage);
    });

    savePresetBtn.addEventListener("click", () => {
      const name = presetNameInput.value.trim() || `${looks[state.activeLook].name} Custom`;
      if (!name) {
        showToast("Enter a preset name", "error", "circle-alert");
        return;
      }
      const presets = getPresets();
      const preset = {
        id: crypto.randomUUID ? crypto.randomUUID() : String(Date.now()),
        name: name.trim(),
        favorite: false,
        settings: snapshotSettings(),
      };
      presets.push(preset);
      setPresets(presets);
      presetSelect.value = preset.id;
      favoritePresetBtn.classList.remove("active");
      saveLastSession();
      showToast("Preset saved", "success", "check");
    });

    favoritePresetBtn.addEventListener("click", () => {
      const preset = selectedPreset();
      if (!preset) {
        showToast("Select a preset first", "error", "circle-alert");
        return;
      }
      const presets = getPresets().map(item => item.id === preset.id ? { ...item, favorite: !item.favorite } : item);
      setPresets(presets);
      presetSelect.value = preset.id;
      favoritePresetBtn.classList.toggle("active", !preset.favorite);
      showToast(preset.favorite ? "Removed from favorites" : "Added to favorites", "success", "star");
    });

    presetSelect.addEventListener("change", () => {
      const preset = selectedPreset();
      if (preset) {
        presetNameInput.value = preset.name;
        favoritePresetBtn.classList.toggle("active", Boolean(preset.favorite));
        pushUndoState();
        applySettings(preset.settings);
        updateEditButtons();
      }
    });

    renamePresetBtn.addEventListener("click", () => {
      const preset = selectedPreset();
      if (!preset) {
        showToast("Select a preset first", "error", "circle-alert");
        return;
      }
      const name = presetNameInput.value.trim();
      if (!name) {
        showToast("Enter a preset name", "error", "circle-alert");
        return;
      }
      const presets = getPresets().map(item => item.id === preset.id ? { ...item, name: name.trim() } : item);
      setPresets(presets);
      presetSelect.value = preset.id;
      showToast("Preset renamed", "success", "pencil");
    });

    deletePresetBtn.addEventListener("click", () => {
      const preset = selectedPreset();
      if (!preset) {
        showToast("Select a preset first", "error", "circle-alert");
        return;
      }
      if (!confirm(`Delete "${preset.name}"?`)) return;
      setPresets(getPresets().filter(item => item.id !== preset.id));
      favoritePresetBtn.classList.remove("active");
      showToast("Preset deleted", "success", "trash-2");
    });

    renderTabs();
    renderPresetCategories();
    renderLooks();
    renderControls();
    renderSwatches();
    renderPresetOptions();
      syncFormFromState();
      restoreLastSession();
      updateEditButtons();
    applyLanguage();
    window.addEventListener("load", () => {
      refreshIcons();
      ensureStampFont().then(() => {
        syncStampFontSample();
        renderImage();
      });
    }, { once: true });
  </script>
</body>
</html>
